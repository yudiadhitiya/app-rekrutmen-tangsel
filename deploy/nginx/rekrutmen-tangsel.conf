# Konfigurasi nginx untuk Rekrutmen Tangsel.
#
# Ganti nama domain dan path di bawah ini dengan milik server yang dipakai.
# Sertifikat dibuat dengan certbot:
#
#   certbot --nginx -d rekrutmen.example.go.id

server {
    listen 80;
    listen [::]:80;
    server_name rekrutmen.example.go.id;

    # Permintaan yang masuk lewat HTTP dialihkan ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rekrutmen.example.go.id;

    ssl_certificate     /etc/letsencrypt/live/rekrutmen.example.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rekrutmen.example.go.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batas ukuran permintaan. Upload massal memakai batas sendiri di dalam
    # aplikasi, jadi angka ini lebih besar darinya.
    client_max_body_size 8m;

    # Header keamanan (P-26). Nilainya harus sama dengan
    # backend/internal/api/security.go, karena pustaka Excel dimuat dari CDN.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:" always;

    root /opt/rekrutmen/frontend;
    index index.html;

    # API ditangani oleh server Go.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Header ini ditimpa, bukan ditambahkan. Dengan begitu pemanggil tidak
        # bisa menyisipkan alamat palsu di dalamnya dan melewati batas
        # percobaan login atau pendaftaran.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Header ini membuat aplikasi menganggap permintaan berasal dari
        # koneksi yang aman, jadi cookie sesi memakai flag Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Aset hasil build tidak berubah selama berbulan-bulan.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header di blok ini menggantikan header blok utama, jadi header
        # keamanan harus diulang di sini.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:" always;
    }

    # Halaman aplikasi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
