name: CI

# The build and the checks of every push and every pull request.
#
# The workflow covers three things:
#   1. the backend: vet and test of the Go code
#   2. the frontend: the production build of the Vite app
#   3. the end-to-end checks: the built application is started and driven by
#      a browser, so a change that breaks the login or the upload is noticed
#      before it reaches the server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./... -count=1

      - name: Build
        working-directory: backend
        run: go build -o bin/rekr-server ./cmd/server

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the browser and the test tools
        run: npm ci

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build the server and the test accounts
        working-directory: backend
        run: |
          go build -o bin/rekr-server ./cmd/server
          go run ./cmd/e2eseed ../e2e-data

      - name: Start the server
        working-directory: backend
        env:
          ADDR: 127.0.0.1:8100
          DATA_DIR: ../e2e-data
          FRONTEND_DIR: ../frontend/dist
          SESSION_SECRET: ci-secret-for-the-end-to-end-checks-000000000000
          COOKIE_SECURE: 'false'
        run: |
          ./bin/rekr-server > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/api/health > /dev/null; then
              echo "server siap"
              exit 0
            fi
            sleep 1
          done
          echo "server tidak siap" >&2
          cat /tmp/server.log >&2
          exit 1

      - name: Run the checks
        run: npx playwright test

      - name: Show the log of the server
        if: failure()
        run: cat /tmp/server.log

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true
